<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="imagem/Logo Medieval _Weapon & Slash_.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sekuya&display=swap" rel="stylesheet">
</head>

<script>
    const form = document.querySelector("form");

    form.addEventListener("submit", async (e) => {
        e.preventDefault(); // impede reload

        const usuario = {
            username: document.querySelector("#nome").value,
            email: document.querySelector("#email").value,
            password: document.querySelector("#senha").value,
            phone: document.querySelector("#telefone").value,
            address: document.querySelector("#endereco").value
        };

        try {
            const API_URL = "https://weapon-backend.onrender.com";

            const resposta = await fetch(`${API_URL}/users/register`, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(usuario)
            });

    const dados = await resposta.json();
    console.log(dados);

    alert(dados.msg || dados.erro);

    } catch (erro) {
        console.error("Erro:", erro);
    }
});
</script>

<body class="cadastro">

    <div class="container">

        <header class="sekuya-regular">
            <div class="logo"><a href="index.html"></a></div>

            <nav>
                <a href="index.html">PRODUTOS</a>
                <a href="pedido.html">PEDIDOS</a>
                <a href="carrinho.html">CARRINHO</a>
            </nav>

            <div class="login">
                <a>ENTRAR</a>
                <a>CADASTRO</a>
            </div>
        </header>

        <main class="sekuya-regular">
            <div class="formulario">
                <form action="https://weapon-backend.onrender.com/users/register" method="post">
                    <label for="nome">NOME:</label>
                    <input name="nome" id="nome" type="text" placeholder="Digite seu nome">
                    <label for="email">EMAIL:</label>
                    <input name="email" id="email" type="email" placeholder="Digite seu email">
                    <label for="senha">SENHA:</label>
                    <input name="senha" id="senha" type="password" placeholder="Digite sua Senha">
                    <label for="telefone">TELEFONE:</label>
                    <input name="telefone" id="telefone" type="text" placeholder="Digite seu numero de telefone">
                    <label for="endereco">ENDEREÇO:</label>
                    <input name="endereco" id="endereco" type="text" placeholder="Digite seu endereço">
                    <button type="submit">CADASTRE-SE</button>
                </form>
            </div>

        </main>
        <aside class="asideE">

        </aside>
        <aside class="asideD"></aside>
        <footer class="jost-regular">
            2026 - Weapons And Slash - Todos os Direitos Reservados
        </footer>

    </div>

</body>

</html>
